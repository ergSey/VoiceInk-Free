# Builds a VoiceInk-Free DMG for every new tag of the original repository
# (Beingpax/VoiceInk) and publishes it as a GitHub Release of this repository.
#
# Code sync: the app is built from the upstream tag as is; only scripts/free/
# from this repository's main branch is copied on top (it patches the sources
# for the build and restores them afterwards). The upstream tag is pushed here
# too, so the release's "Source code" archives match the build.
#
# Releases are created as drafts by default. Scheduled runs publish them right
# away only when the repository variable PUBLISH_RELEASES is "true".
#
# Rebuild: a manual run with `rebuild` set rebuilds a tag whose release already
# exists (e.g. after changing scripts/free) and replaces its DMG, checksum and
# notes in place. The release keeps its tag, title and draft/published state.
#
# Keepalive: GitHub disables scheduled workflows in a public repository after
# 60 days without repository activity, and this workflow makes no commits.
# Every run re-enables itself through the REST API (no dummy commits). If it
# still gets disabled, re-enable it with `gh workflow enable build-release.yml`.

name: Build release

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build, e.g. v2.27 (empty: latest upstream tag)"
        required: false
        default: ""
      draft:
        description: "Create the release as a draft"
        type: boolean
        required: false
        default: true
      rebuild:
        description: "Release already exists: rebuild it and replace its DMG and notes"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/Beingpax/VoiceInk.git
  UPSTREAM_WEB: https://github.com/Beingpax/VoiceInk

jobs:
  keepalive:
    name: Keep schedule enabled
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow="$(basename "${GITHUB_WORKFLOW_REF%@*}")"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/enable"
          state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow" --jq .state)"
          echo "Workflow $workflow state: $state"
          [[ "$state" == "active" ]] || { echo "::error::workflow $workflow is $state"; exit 1; }

  check:
    name: Find new upstream tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      latest: ${{ steps.tag.outputs.latest }}
      build: ${{ steps.release.outputs.build }}
      replace: ${{ steps.release.outputs.replace }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tags="$(git ls-remote --tags --refs "$UPSTREAM_URL" 'refs/tags/v*' \
            | awk '{ sub("refs/tags/", "", $2); print $2 }' \
            | grep -E '^v[0-9]+\.[0-9]+$' | sort -V)"
          latest="$(tail -n1 <<<"$tags")"
          [[ -n "$latest" ]] || { echo "::error::no vX.Y tags found upstream"; exit 1; }
          tag="${INPUT_TAG:-$latest}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must look like vX.Y, got '$tag'"; exit 1; }
          grep -qxF "$tag" <<<"$tags" || { echo "::error::tag $tag not found in $UPSTREAM_WEB"; exit 1; }
          echo "Upstream tag: $tag (latest: $latest)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "latest=$([[ "$tag" == "$latest" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          INPUT_REBUILD: ${{ inputs.rebuild }}
        run: |
          set -euo pipefail
          # Lists drafts too (the token has push access).
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')"
          if ! grep -qxF "$TAG" <<<"$existing"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "replace=false" >> "$GITHUB_OUTPUT"
          elif [[ "$INPUT_REBUILD" == "true" ]]; then
            echo "::notice::Release $TAG exists, rebuilding it and replacing its DMG"
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "replace=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Release $TAG already exists, nothing to build"
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "replace=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out this repository
        if: steps.release.outputs.build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Push upstream tag
        if: steps.release.outputs.build == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists in this repository"
            exit 0
          fi
          git fetch --no-tags "$UPSTREAM_URL" "+refs/tags/$TAG:refs/tags/$TAG"
          if ! git push origin "refs/tags/$TAG"; then
            echo "::error::Cannot push tag $TAG. If GitHub push protection blocked a secret in upstream history," \
              "allow it via the link in the log above (or push the tag manually:" \
              "git fetch upstream tag $TAG && git push origin $TAG), then re-run this workflow."
            exit 1
          fi

  build:
    name: Build DMG and release
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-26
    timeout-minutes: 120
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - name: Check out upstream tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.check.outputs.tag }}
          path: src
          persist-credentials: false

      - name: Check out build scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: free
          sparse-checkout: scripts/free
          persist-credentials: false

      - name: Overlay VoiceInk-Free scripts
        run: |
          set -euo pipefail
          rm -rf src/scripts/free
          mkdir -p src/scripts
          cp -R free/scripts/free src/scripts/free
          git -C src status --short

      - name: Show toolchain
        id: xcode
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          swift_version="$(swift --version 2>&1 | sed -nE 's/.*Swift version ([0-9]+\.[0-9]+).*/\1/p' | head -n1)"
          [[ "$(printf '%s\n' 6.2 "$swift_version" | sort -V | head -n1)" == "6.2" ]] \
            || { echo "::error::Swift 6.2+ required, got $swift_version"; exit 1; }
          echo "version=$(xcodebuild -version | awk 'NR==1 { print $2 }')" >> "$GITHUB_OUTPUT"
          echo "build=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_OUTPUT"

      - name: Install create-dmg
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install create-dmg

      # `make whisper` (called by build-dmg.sh) skips the build when the framework exists.
      - name: Restore whisper.xcframework
        id: whisper-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/VoiceInk-Dependencies/whisper.cpp/build-apple/whisper.xcframework
            ~/VoiceInk-Dependencies/whisper-commit.txt
          key: whisper-xcframework-${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.build }}-v1

      - name: Build whisper.xcframework
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        working-directory: src
        run: |
          set -euo pipefail
          make whisper
          git -C ~/VoiceInk-Dependencies/whisper.cpp rev-parse HEAD > ~/VoiceInk-Dependencies/whisper-commit.txt

      - name: Save whisper.xcframework
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/VoiceInk-Dependencies/whisper.cpp/build-apple/whisper.xcframework
            ~/VoiceInk-Dependencies/whisper-commit.txt
          key: ${{ steps.whisper-cache.outputs.cache-primary-key }}

      - name: Build DMG
        working-directory: src
        env:
          OUTPUT_DIR: ${{ runner.temp }}/dmg
          DMG_SKIP_FINDER: "0"
        run: scripts/free/build-dmg.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_DRAFT: ${{ inputs.draft }}
          PUBLISH_RELEASES: ${{ vars.PUBLISH_RELEASES }}
          LATEST: ${{ needs.check.outputs.latest }}
          REPLACE: ${{ needs.check.outputs.replace }}
          XCODE_VERSION: ${{ steps.xcode.outputs.version }}
          XCODE_BUILD: ${{ steps.xcode.outputs.build }}
          DMG_DIR: ${{ runner.temp }}/dmg
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=("$DMG_DIR"/VoiceInk-*-arm64.dmg)
          [[ ${#dmgs[@]} -eq 1 ]] || { echo "::error::expected one DMG in $DMG_DIR"; exit 1; }
          dmg="${dmgs[0]}"
          dmg_name="$(basename "$dmg")"
          version="${dmg_name#VoiceInk-}"
          version="${version%-arm64.dmg}"
          sha256="$(cut -d' ' -f1 "$dmg.sha256")"
          whisper_commit="$(cat ~/VoiceInk-Dependencies/whisper-commit.txt 2>/dev/null || echo unknown)"
          server="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"

          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            draft="$INPUT_DRAFT"
          elif [[ "$PUBLISH_RELEASES" == "true" ]]; then
            draft=false
          else
            draft=true
          fi

          notes="$RUNNER_TEMP/notes.md"
          cat > "$notes" <<EOF
          Unofficial free build of [VoiceInk]($UPSTREAM_WEB) $TAG for Apple Silicon Macs (arm64), ad-hoc signed, not notarized.

          **What's new:** see the [original release notes]($UPSTREAM_WEB/releases/tag/$TAG).

          Неофициальная бесплатная сборка VoiceInk $TAG для Mac на Apple Silicon. Что нового — в заметках оригинала по ссылке выше.

          ### Install

          Download \`$dmg_name\`, drag VoiceInk to Applications, then run \`xattr -cr /Applications/VoiceInk.app\` once (or use **Open Anyway** in System Settings → Privacy & Security). Details: [README]($server#install) · [на русском]($server/blob/main/README.ru.md).

          ### Checksum

          SHA-256: \`$sha256\`

          \`\`\`
          shasum -a 256 -c $dmg_name.sha256
          \`\`\`

          ### Build

          - Source: upstream tag \`$TAG\`, unchanged; build patches from [\`scripts/free\`]($server/tree/$GITHUB_SHA/scripts/free) at \`${GITHUB_SHA:0:7}\`.
          - Xcode $XCODE_VERSION ($XCODE_BUILD), whisper.cpp \`${whisper_commit:0:12}\`.
          - Built by [workflow run]($server/actions/runs/$GITHUB_RUN_ID).

          If VoiceInk is useful to you, please support the author by [buying a license](https://tryvoiceink.com/pricing).
          EOF

          if [[ "$REPLACE" == "true" ]]; then
            gh release upload "$TAG" "$dmg" "$dmg.sha256" -R "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file "$notes"
            echo "::notice::Release $TAG rebuilt: DMG and notes replaced, SHA-256 $sha256"
            exit 0
          fi

          # Drafts do not own their tag, so check the full list (drafts included).
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')"
          if grep -qxF "$TAG" <<<"$existing"; then
            echo "::error::Release $TAG appeared while building"; exit 1
          fi
          gh release create "$TAG" "$dmg" "$dmg.sha256" \
            -R "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "VoiceInk $version (Apple Silicon)" \
            --notes-file "$notes" \
            --draft="$draft" \
            --latest="$LATEST"
          echo "::notice::Release $TAG created (draft=$draft), SHA-256 $sha256"
